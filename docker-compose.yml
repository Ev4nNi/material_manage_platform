services:
  backend:
    build: ./backend
    container_name: material-backend
    restart: unless-stopped
    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 256
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "8081:8080"
    environment:
      - APP_PORT=8080
      - STORAGE_PATH=/data/storage
      - DB_PATH=/data/db/material.db
      - LOG_PATH=/data/logs/application.log
      - JAVA_TOOL_OPTIONS=-Xms256m -Xmx384m -XX:MaxMetaspaceSize=128m -XX:MaxDirectMemorySize=128m -Xss512k -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/data/logs/heapdump.hprof -XX:+ExitOnOutOfMemoryError
    volumes:
      - /data2/material_manage_platform/storage:/data/storage
      - /data2/material_manage_platform/db:/data/db
      - /data2/material_manage_platform/logs:/data/logs
    networks:
      - material-net
    healthcheck:
      test: "wget -q -O - http://localhost:8080/api/auth/me || true"
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    container_name: material-frontend
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    ports:
      - "3001:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - material-net

networks:
  material-net:
    driver: bridge
