server:
  port: 8081

spring:
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:/data2/material_manage_platform/db/material.db
    username:
    password:

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 5GB

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.material.platform.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

storage:
  strategy: local
  local:
    base-path: /data2/material_manage_platform/storage
  tos:
    endpoint:
    access-key:
    secret-key:
    bucket:

logging:
  level:
    com.material.platform: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /data2/material_manage_platform/logs/application.log
    max-size: 100MB
    max-history: 30
